[package]
name = "ip-scout"
version = "0.13.0"
edition = "2024"
rust-version = "1.88"
description = "A native Windows IPv4 network scanner"
license = "MIT"

[features]
gui-smoke = []

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui_extras = "0.33.3"
egui-phosphor = { version = "0.11", features = ["regular"] }
serde = { version = "1", features = ["derive"] }
csv = "1.3"
hickory-resolver = "0.24.4"
hickory-proto = "0.24.4"
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "sync", "io-util"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
futures-util = "0.3"
rfd = "0.15"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
netbios-parser = "0.2"
mdns-sd = "0.21.1"
quick-xml = "0.38"
socket2 = "0.6"
uuid = { version = "1", features = ["v4"] }
scraper = "0.24"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
x509-parser = "0.18"
snmp2 = { version = "0.5.2", default-features = false, features = ["tokio", "heap_buffers"] }
sntpc = { version = "0.11", features = ["std"] }
sntpc-net-tokio = "1.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "test-util"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rcgen = "0.14"

[[example]]
name = "gui_smoke"
required-features = ["gui-smoke"]

[profile.release]
lto = "thin"
strip = true

